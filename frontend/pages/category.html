<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category | Nithara Fashion Store</title>
    <link rel="icon" type="image/jpeg" href="../assets/images/favicon.jpg">
    <link rel="stylesheet" href="../css/main.css?v=10">
    <link rel="stylesheet" href="../css/components.css?v=10">
    <style>
        .category-hero {
            height: 400px;
            background-color: var(--dark);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background-size: cover;
            background-position: center;
            margin-top: 80px; /* Navbar offset */
        }
        .category-hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 26, 0.7);
        }
        .category-hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            padding: 0 20px;
        }
        .category-hero h1 {
            color: var(--white);
            font-size: 3.5rem;
            margin-bottom: 15px;
        }
        .category-hero p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.8);
        }
        /* Reuse product card styles from products.html */
        .discount-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #E53E3E;
            color: var(--white);
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            z-index: 2;
        }
        .btn-view-product {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px 0;
            background-color: var(--dark);
            color: var(--white);
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: var(--transition);
            margin-top: 15px;
        }
        .btn-view-product:hover {
            background-color: var(--primary-gold);
        }
        .stock-status {
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .in-stock { color: #38A169; }
        .out-of-stock { color: #E53E3E; }
    </style>
</head>
<body>

    <!-- Premium Global Loader -->
    <div class="global-loader" id="global-loader">
        <div class="loader-brand">NITHARA</div>
        <div class="spinner"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="brand">
                NITHARA
                <span>Fashion Store</span>
            </a>
            
            <ul class="nav-links">
                <li>
                    <a href="/">
                        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        <span>Home</span>
                    </a>
                </li>
                <li>
                    <a href="/pages/about.html">
                        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>About</span>
                    </a>
                </li>
                <li>
                    <a href="/pages/contact.html">
                        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        <span>Contact</span>
                    </a>
                </li>
            </ul>
            
            <div class="nav-search-widget" style="margin-right: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="global-search-input" placeholder="Search Nithara...">
                <div class="search-dropdown" id="global-search-dropdown"></div>
            </div>
            <button class="hamburger">☰</button>
        </div>
    </nav>

    <!-- Category Hero -->
    <header class="category-hero" id="category-hero">
        <div class="category-hero-content">
            <h1 id="category-title"><div class="spinner-container"><div class="spinner"></div></div></h1>
            <p id="category-desc"></p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="section">
        <div class="container">
            <!-- Products Grid -->
            <div class="grid grid-4" id="category-products-container">
                <div class="spinner-container"><div class="spinner"></div></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border: none;">
                <p>&copy; 2026 Nithara Fashion Store. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/categories.js"></script>
    <script src="../js/search-widget.js"></script>
</body>
</html>
